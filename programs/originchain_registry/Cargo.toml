[package]
name = "originchain_registry"
version = "0.1.0"
description = "OriginChain append-only provenance registry"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "originchain_registry"

[features]
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "1.2.2"

